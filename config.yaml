# OnlyIchu — Ichimoku Cloud options strategy on Upstox
# mode: paper (simulated fills, real market data) | live (real orders on Upstox)
mode: paper

data:
  # Completed 1-minute candles are pulled from Upstox's intraday candle REST API,
  # then aggregated into 5-minute candles locally. The engine acts within one poll
  # of a candle becoming available; 2s catches a just-finalized candle quickly.
  # (Upstox itself finalizes a 1m candle ~20s after the minute — that broker-side
  # lag is not something a faster poll can remove.)
  poll_interval_seconds: 2
  # Days of historical 1m candles fetched at startup to warm up the indicators
  # (Ichimoku needs 52 + 26 = 78 completed candles per timeframe; 5m needs ~2 sessions).
  warmup_days: 7

session:
  timezone: Asia/Kolkata
  market_open: "09:15"
  market_close: "15:30"
  # No fresh entries after this time
  entry_cutoff: "15:00"
  # All open positions are force-closed at this time
  square_off: "15:15"
  # Opening-range breakout filter: hold off on the day's first entry until price
  # closes beyond the high/low of the first N minutes. Skips a flat/choppy open
  # and waits for the market to pick a direction. 0 = trade from the open.
  opening_range_minutes: 15

strategy:
  # Both pipelines run independently per index, exactly per the strategy spec.
  timeframes_minutes: [1, 5]
  # Ichimoku periods. Profiles from the optimization note:
  #   Standard (daily):        9  / 26 / 52  / 26
  #   Fast intraday (5m scalp): 7 / 22 / 44  / 22
  #   Smooth trend (1m/5m):    12 / 24 / 120 / 24   <- recommended for noise filtering
  tenkan: 12
  kijun: 24
  senkou_b: 120
  displacement: 24

  # --- Entry filters (extra confluence ON TOP of the Ichimoku breakout) ---
  # Entry ALWAYS requires the close beyond all four Ichimoku levels. These three
  # optional filters add confluence and are OFF by default; each can be toggled
  # live from the dashboard (persisted to state/settings.json).
  # Chikou span must be clear of price `chikou_period` candles ago.
  use_chikou_filter: false
  chikou_period: 26
  # MACD(fast,slow,signal) histogram SLOPE must confirm momentum: for a LONG the
  # current (closed) histogram must be GREATER than the previous candle's; for a
  # SHORT it must be LESSER. This is the ENTRY filter only; the MACD-slope EXIT
  # (exit_mode: macd) is independent and always active when selected.
  use_macd_filter: true
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  # Refuse entries when the cloud is thinner than min_cloud_thickness index points
  # (low-volatility consolidation). use_thickness_filter turns the gate on/off;
  # min_cloud_thickness is the GLOBAL default and each index can override it below
  # (an index without an override inherits this).
  use_thickness_filter: false
  min_cloud_thickness: 5

  # --- Exit restructuring ---
  # 'macd'      = momentum fade on the underlying MACD histogram: exit a LONG the
  #               first time the current (closed) histogram is LESS than the prior
  #               candle's; exit a SHORT the first time it is GREATER. Else hold.
  # 'kijun'     = soft trailing stop on a Kijun close + hard stop at the opposite
  #               Kumo edge (Span B for longs / Span A for shorts).
  # 'any_level' = original: exit on a close past ANY of the four lines.
  exit_mode: macd
  # Book this fraction of the position once the OPTION premium gains this %.
  # Needs >= 2 lots to split (a single lot can't be halved). 0 disables.
  partial_target_pct: 15
  partial_exit_fraction: 0.5

# Span B strategy (separate dashboard page at /spanb; its own engine, paper state
# and trade logs). Sells an OTM option on the Span B slope — short call when Span B
# falls, short put when it rises — and buys it back when the slope reverts.
spanb:
  # how many strikes out of the money to sell
  otm_strikes: 5

options:
  # ITM option selection: pick the strike whose delta is closest to target_delta
  # within [delta_min, delta_max] (absolute value for puts).
  target_delta: 0.70
  delta_min: 0.65
  delta_max: 0.75
  # nearest = nearest unexpired expiry (weekly / 0DTE when available)
  expiry: nearest
  # Skip an expiry that is this many days away or less and roll to the next one
  # (avoids the high gamma/theta/pin risk of trading right at expiry). 0 = off.
  min_days_to_expiry: 2
  # LIMIT places a marketable limit at LTP +/- limit_tolerance_pct; MARKET uses market orders.
  order_type: LIMIT
  limit_tolerance_pct: 0.25
  # I = intraday, D = delivery/margin
  product: I
  # Liquidity guards — thin/untraded strikes are skipped. 0 disables a check.
  # min_volume: reject strikes that have traded fewer contracts today than this.
  #   An untraded (0-volume) strike has a STALE ltp/greeks that mislead delta
  #   selection and fabricate PnL, so keep this > 0. Raise it for stricter liquidity.
  # min_open_interest: reject strikes whose reported OI is below this.
  # max_spread_pct: reject strikes whose bid-ask spread exceeds this % of the mid price.
  min_volume: 1
  min_open_interest: 0
  max_spread_pct: 5.0

web:
  host: 127.0.0.1
  port: 8080
  # Browser auto-refresh cadence; the server caches Upstox data for ~half this.
  refresh_seconds: 10

# Trading charges — deducted from P&L so realized/total/target are NET, matching
# what Upstox reports (Gross P&L − charges = Net P&L). Rates follow the current
# NSE/Upstox F&O options schedule; tune them to match your contract notes exactly.
# Set apply_charges: false to report gross P&L.
charges:
  apply_charges: true
  brokerage_per_order: 20        # flat ₹/order (F&O); charged on entry AND exit
  brokerage_pct: 0.0             # if > 0, brokerage = min(flat, pct × turnover)
  stt_sell_pct: 0.001            # STT on option SELL premium (0.1%)
  exchange_txn_pct: 0.0003503    # NSE options exchange transaction charge
  sebi_pct: 0.000001             # SEBI turnover fee (₹10 / crore)
  stamp_buy_pct: 0.00003         # stamp duty on BUY value (0.003%)
  gst_pct: 0.18                  # GST on (brokerage + exchange txn + SEBI)

risk:
  lots_per_trade: 1
  # Max entries per (index, timeframe) pipeline per day. 0 = unlimited (no cap).
  max_trades_per_day_per_pipeline: 0
  # Stop taking new entries once realized PnL for the day is below -max_daily_loss (INR). 0 disables.
  max_daily_loss: 10000
  # When total profit (realized + unrealized MTM) reaches this INR value, square off
  # all positions at market and stop trading for the rest of the day. 0 disables.
  # Also settable live from the dashboard's TARGET box.
  daily_profit_target: 0

paper:
  starting_cash: 500000
  # applied against LTP on simulated fills (buy worse, sell worse)
  slippage_pct: 0.05
  state_file: state/paper_state.json
  trade_log: state/trades_paper.csv

live:
  trade_log: state/trades_live.csv

# Index universe. `key` is the Upstox instrument key — verify any key with:
#   python -m onlyichu instruments --search "smlcap"
# options_available=false indices have no exchange-traded options; they are traded
# synthetically at index level in paper mode and skipped in live mode.
# min_cloud_thickness per index: the Kumo thickness gate is measured in that
# index's own points, so each index needs its own floor (BANKNIFTY moves in the
# hundreds while MIDCPNIFTY moves in the tens). Roughly scaled to ~0.05% of the
# index level. Omit the field on an index to inherit strategy.min_cloud_thickness.
instruments:
  - name: NIFTY
    key: "NSE_INDEX|Nifty 50"
    enabled: true
    options_available: true
    min_cloud_thickness: 12
  - name: BANKNIFTY
    key: "NSE_INDEX|Nifty Bank"
    enabled: true
    options_available: true
    min_cloud_thickness: 25
  - name: FINNIFTY
    key: "NSE_INDEX|Nifty Fin Service"
    enabled: true
    options_available: true
    min_cloud_thickness: 12
  - name: MIDCPNIFTY
    key: "NSE_INDEX|NIFTY MID SELECT"
    enabled: true
    options_available: true
    min_cloud_thickness: 6
  - name: NIFTYNXT50
    key: "NSE_INDEX|Nifty Next 50"
    enabled: true
    options_available: true
    min_cloud_thickness: 30
